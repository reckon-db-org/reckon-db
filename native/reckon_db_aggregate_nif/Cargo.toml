[package]
name = "reckon_db_aggregate_nif"
version = "0.1.0"
authors = ["rgfaber"]
edition = "2021"
description = "NIF optimizations for reckon-db event aggregation operations"

[lib]
name = "reckon_db_aggregate_nif"
crate-type = ["cdylib"]

[dependencies]
# Rustler for Erlang NIF bindings
rustler = "0.34"

[profile.release]
lto = true
opt-level = 3

[lints.clippy]
# The structural floor (macula-codebase-checks#9): clippy.toml holds the
# thresholds these are measured against.
excessive_nesting = "deny"
cognitive_complexity = "deny"
too_many_lines = "deny"
